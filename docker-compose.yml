version: '3.8'

services:
  redis:
    build: ./redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  pdf_processor_api:
    build:
      context: .
      dockerfile: ./pdf_processor/Dockerfile
    command: uvicorn pdf_processor.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - "80:8001"
    env_file:
      - ./pdf_processor/.env
    depends_on:
      - redis
    networks:
      - app-network

  pdf_processor_worker:
    build:
      context: .
      dockerfile: ./pdf_processor/Dockerfile
    command: celery -A pdf_processor.celery_app worker --loglevel=info -c ${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - .:/app
    env_file:
      - ./pdf_processor/.env
    depends_on:
      - redis
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes: {}